name: Acquire historical images wave 2
on:
  push:
    branches: [research/historical-documentary-images-wave2-20261010]
    paths:
      - .github/workflows/acquire-historical-images-wave2.yml
      - scripts/download-chapter-images-wave2.mjs
      - docs/media/curated-commons-queue-wave2.json
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: documentary-wave2-download
  cancel-in-progress: true
jobs:
  acquire:
    if: github.ref == 'refs/heads/research/historical-documentary-images-wave2-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/historical-documentary-images-wave2-20261010}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - name: Download source originals, verify rights, generate local derivatives
        run: node scripts/download-chapter-images-wave2.mjs
      - name: Test all content and build image detail pages
        run: |
          npm test
          npm run build
      - name: Commit downloaded binaries and image catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/historical/ src/content/images/ docs/media/chapter-download-run-wave2.json
          if ! git diff --cached --quiet; then
            git commit -m "Add second batch of locally stored historical documentary images"
            git reset --hard HEAD
            git clean -fd
            git fetch origin research/historical-documentary-images-wave2-20261010
            git rebase origin/research/historical-documentary-images-wave2-20261010
            git push origin HEAD:research/historical-documentary-images-wave2-20261010
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentary-image-wave2-report
          path: docs/media/chapter-download-run-wave2.json
          retention-days: 30
