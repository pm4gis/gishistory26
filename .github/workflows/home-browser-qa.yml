name: Homepage and navigation browser QA
on:
  pull_request:
    paths:
      - 'src/pages/index.astro'
      - 'src/pages/datasets/**'
      - 'src/pages/themes/**'
      - 'src/pages/browse/**'
      - 'src/components/SubjectImage.astro'
      - 'src/components/Browse.svelte'
      - 'scripts/tile-browser-qa.mjs'
      - 'src/lib/subject-media.mjs'
      - 'src/content/images/**'
      - 'docs/media/direct-gis-image-followup-20261015.json'
      - 'src/pages/read/**'
      - 'src/pages/about/**'
      - 'src/pages/contribute/**'
      - 'src/layouts/Layout.astro'
      - 'src/components/Reader.svelte'
      - 'src/lib/home-highlights.mjs'
      - 'src/lib/passage-contributions.mjs'
      - 'src/styles/site.css'
      - 'scripts/home-browser-qa.mjs'
      - 'scripts/first-visit-browser-qa.mjs'
      - 'scripts/landing-editorial-browser-qa.mjs'
      - 'src/lib/home-stories.mjs'
      - 'scripts/publication-return-browser-qa.mjs'
      - 'src/lib/publication-return.mjs'
      - 'src/pages/history/**'
      - 'src/pages/timeline/**'
      - 'src/pages/network/**'
      - 'src/pages/publications/**'
      - 'src/components/PublicationReader.astro'
      - 'scripts/glass-navigation-browser-qa.mjs'
      - '.github/workflows/home-browser-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/index.astro'
      - 'src/pages/datasets/**'
      - 'src/pages/themes/**'
      - 'src/pages/browse/**'
      - 'src/components/SubjectImage.astro'
      - 'src/components/Browse.svelte'
      - 'scripts/tile-browser-qa.mjs'
      - 'src/lib/subject-media.mjs'
      - 'src/content/images/**'
      - 'docs/media/direct-gis-image-followup-20261015.json'
      - 'src/pages/contribute/**'
      - 'src/layouts/Layout.astro'
      - 'src/styles/site.css'
      - 'scripts/home-browser-qa.mjs'
      - 'scripts/first-visit-browser-qa.mjs'
      - 'scripts/landing-editorial-browser-qa.mjs'
      - 'src/lib/home-stories.mjs'
      - 'scripts/publication-return-browser-qa.mjs'
      - 'src/lib/publication-return.mjs'
      - 'src/pages/history/**'
      - 'src/pages/timeline/**'
      - 'src/pages/network/**'
      - 'src/pages/publications/**'
      - 'src/components/PublicationReader.astro'
      - '.github/workflows/home-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --ignore-scripts playwright@1.56.1 @axe-core/playwright@4.14.0
      - run: npx playwright install --with-deps chromium
      - name: Test homepage and contribution journeys in Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist > /tmp/nzgis-home-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:4321/; then break; fi
            sleep 1
          done
          if ! curl -fsS -o /dev/null http://127.0.0.1:4321/; then cat /tmp/nzgis-home-preview.log; echo 'Preview failed to start'; exit 1; fi
          node scripts/publication-return-browser-qa.mjs
          node scripts/landing-editorial-browser-qa.mjs
          node scripts/first-visit-browser-qa.mjs
          node scripts/home-browser-qa.mjs
          node scripts/glass-navigation-browser-qa.mjs
          node scripts/tile-browser-qa.mjs
      - name: Verify the currently published homepage in Chromium
        run: node scripts/verify-live-homepage-links.mjs
      - name: Retain responsive glass navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glass-navigation-qa
          path: |
            docs/verification/publication-return/
            docs/verification/landing-editorial/
            docs/verification/live-homepage/
            docs/verification/first-visit/
            docs/verification/glass-nav-qa/
            docs/verification/tile-navigation-qa/
          if-no-files-found: ignore
          retention-days: 30
