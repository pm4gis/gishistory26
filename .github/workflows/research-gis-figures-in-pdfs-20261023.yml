name: Research GIS map figures in archived PDF sources
on:
  push:
    branches: [media/gis-publication-figure-research-wave3-20261023]
    paths:
      - scripts/discover-gis-figures-in-pdfs-20261023.py
      - .github/workflows/research-gis-figures-in-pdfs-20261023.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media/gis-publication-figure-research-wave3-20261023
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pymupdf==1.26.5
      - name: Locate genuine GIS screenshots and computer-made map figures in archived originals
        run: python scripts/discover-gis-figures-in-pdfs-20261023.py
      - name: Commit source-page and figure-caption evidence for editorial review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/media/gis-figure-research-wave3-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m 'Inventory computer GIS figures with exact source PDF and original page'
            git reset --hard HEAD
            git fetch origin media/gis-publication-figure-research-wave3-20261023
            git rebase origin/media/gis-publication-figure-research-wave3-20261023
            git push origin HEAD:media/gis-publication-figure-research-wave3-20261023
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gis-original-pdf-figure-index
          path: docs/media/gis-figure-research-wave3-20261023.json
