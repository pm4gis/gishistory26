name: Acquire final chapter historical source originals
on:
  push:
    branches: [research/period-verified-nzlri-automation-ai-20261011]
    paths:
      - scripts/acquire-primary-geo-figures-20261011.mjs
      - docs/media/four-chapter-primary-figures-20261011.json
      - .github/workflows/acquire-eight-chapter-media-20261011.yml
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: primary-figure-acquisition-20261011
  cancel-in-progress: true
jobs:
  acquire:
    if: github.ref == 'refs/heads/research/period-verified-nzlri-automation-ai-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/period-verified-nzlri-automation-ai-20261011}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - name: Acquire verified original images and record failures
        run: node scripts/acquire-primary-geo-figures-20261011.mjs || true
      - name: Verify all inherited assets, integrity, tests and production build
        run: |
          npm test
          npm run build
      - name: Commit preserved originals and image pages to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/historical/ src/content/images/ docs/media/four-chapter-originals-run-20261011.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive 2025-or-earlier originals with image metadata"
            git reset --hard HEAD
            git clean -fd
            git fetch origin research/period-verified-nzlri-automation-ai-20261011
            git rebase origin/research/period-verified-nzlri-automation-ai-20261011
            git push origin HEAD:research/period-verified-nzlri-automation-ai-20261011
          fi
      - name: Require complete source checks before release
        run: node -e "const d=require('./docs/media/four-chapter-originals-run-20261011.json'); if(d.failed||d.success!==3)throw Error('Incomplete verified source downloads: '+JSON.stringify(d.items))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primary-figure-source-report
          path: docs/media/four-chapter-originals-run-20261011.json
          retention-days: 30
