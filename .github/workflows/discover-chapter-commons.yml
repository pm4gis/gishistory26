name: Discover historical chapter images
on:
  push:
    branches: [research/historical-documentary-images-wave2-20261010]
    paths:
      - scripts/discover-chapter-commons.mjs
      - docs/media/chapter-image-search-plan-wave4-2025.json
      - docs/media/chapter-image-search-plan-wave4b-2025.json
      - .github/workflows/discover-chapter-commons.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  discover:
    if: github.ref == 'refs/heads/research/historical-documentary-images-wave2-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/historical-documentary-images-wave2-20261010}
      - uses: actions/setup-node@v4
        with: {node-version: '22.19.0'}
      - run: node scripts/discover-chapter-commons.mjs docs/media/chapter-image-search-plan-wave4b-2025.json docs/media/commons-discovery-wave4b-2025.json
      - name: Commit sourced discovery index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/commons-discovery-wave4b-2025.json docs/media/commons-candidates-wave4b-2025.json
          git commit -m "Record date-limited chapter image discovery evidence"
          git push origin HEAD:research/historical-documentary-images-wave2-20261010
