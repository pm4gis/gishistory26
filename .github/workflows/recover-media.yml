name: Recover existing published media
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    if: github.ref == 'refs/heads/delivery-review-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: delivery-review-20261010
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: node scripts/recover-published-media.mjs
      - run: npm test
      - run: npm run build
      - name: Commit checked media restoration to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets src/content/images src/content/passages src/content/records content/preservation-manifest.json docs/media
          if ! git diff --cached --quiet; then
            git commit -m "Restore existing published images and exact figure associations"
            git push origin HEAD:delivery-review-20261010
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-recovery
          path: |
            docs/media/
            public/assets/images/
          retention-days: 30
