name: Verify publication
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify excluded names absent from the site and generated pages
        run: node scripts/assert-editorial-exclusions.mjs
      - run: node scripts/editorial.mjs state > docs/verification/editorial-state.json
      - run: node scripts/simulated-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-verification
          path: |
            docs/verification/
            docs/reviews/
          retention-days: 30
