name: Verify and archive licensed 2001 NZ GIS original

on:
  push:
    branches:
      - research/archive-verified-nz-gis-20261030
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Install PDF validation and rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Install locked dependencies
        run: npm ci
      - name: Acquire only the item-level CC BY 4.0 Treasury original
        run: node scripts/acquire-verified-nz-gis-20261030.mjs
      - name: Test publication and historical content
        run: npm test
      - name: Build and validate full site
        run: npm run build
      - name: Check changes and commit validated original to review branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add src/lib/online-pdf-publications.mjs src/lib/verified-nz-gis-publications-20261030.mjs public/assets/publications/pdfs/treasury-internal-mobility-gis-2001.pdf public/assets/publications/thumbnails/treasury-internal-mobility-gis-2001.jpg
          if git diff --cached --quiet; then
            echo 'No new original to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Archive validated CC BY 4.0 Treasury 2001 GIS original and cover'
          git push origin HEAD:research/archive-verified-nz-gis-20261030
