name: Archive pre-2000 New Zealand geospatial PDFs
on:
  push:
    branches: [feature/pre2000-pdfs-mobile-20261018]
    paths:
      - '.github/workflows/acquire-pre2000-pdfs-20261018.yml'
      - 'scripts/acquire-pre2000-pdfs-20261018.mjs'
      - 'src/lib/pre2000-pdf-publications-20261018.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire:
    if: github.ref == 'refs/heads/feature/pre2000-pdfs-mobile-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Install PDF inspection and thumbnail tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: npm ci
      - name: Verify and archive LINZ originals
        run: node scripts/acquire-pre2000-pdfs-20261018.mjs
      - name: Validate complete publication
        run: |
          npm test
          npm run build
          node scripts/assert-editorial-exclusions.mjs
      - name: Commit verified PDFs, first-page thumbnails and source audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/publications/pdfs/ public/assets/publications/thumbnails/ src/lib/pre2000-pdfs-mirrored.mjs docs/verification/pre2000-pdf-acquisition-20261018.json
          if git diff --cached --quiet; then
            echo 'No archival changes required'
            exit 0
          fi
          git commit -m 'Preserve verified 1978-1999 source PDFs and original covers'
          git restore --worktree .
          git fetch origin feature/pre2000-pdfs-mobile-20261018
          git rebase origin/feature/pre2000-pdfs-mobile-20261018
          git push origin HEAD:feature/pre2000-pdfs-mobile-20261018
