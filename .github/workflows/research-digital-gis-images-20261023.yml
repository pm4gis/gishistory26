name: Research authentic GIS image sources wave 2
on:
  push:
    branches: [media/gis-digital-screens-maps-wave2-20261023]
    paths:
      - scripts/discover-digital-gis-images-20261023.mjs
      - .github/workflows/research-digital-gis-images-20261023.yml
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: digital-gis-images-wave2-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media/gis-digital-screens-maps-wave2-20261023
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Discover source-backed GIS illustrations and screenshots
        run: node scripts/discover-digital-gis-images-20261023.mjs
      - name: Preserve a read-only source inventory for editorial selection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/media/digital-gis-image-source-inventory-20261023.json
          if ! git diff --cached --quiet; then
            git commit -m 'Research original digital GIS screenshots and map sources for chapter placement'
            git reset --hard HEAD
            git fetch origin media/gis-digital-screens-maps-wave2-20261023
            git rebase origin/media/gis-digital-screens-maps-wave2-20261023
            git push origin HEAD:media/gis-digital-screens-maps-wave2-20261023
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-zealand-digital-gis-image-research
          path: docs/media/digital-gis-image-source-inventory-20261023.json
          retention-days: 30
